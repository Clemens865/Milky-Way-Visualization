[package]
name = "undiscovered"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Data handling
csv = "1"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system cache
sha2 = "0.10"
hex = "0.4"

# Progress
indicatif = "0.17"

# Colored terminal output
colored = "3"

# Analysis engine
futures = "0.3"    # Concurrent stream processing (buffer_unordered)
kiddo = "4"        # KD-tree spatial indexing
rayon = "1"        # Data-parallel iterators
